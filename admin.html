<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosairo Gems — Local Admin</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin{max-width:1100px;margin:auto;padding:60px 20px}.admin h1{font-family:"Cormorant Garamond",serif;font-size:54px}.admin-card{background:#f5f8fb;padding:28px;margin:20px 0;border:1px solid #e1e7ed}.admin-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #dfe6ed}.admin-row img{width:120px;height:75px;object-fit:cover}.admin-row input{flex:1;padding:12px;border:1px solid #ccd7e2}.note{color:#647587;font-size:13px;line-height:1.7}.back{display:inline-block;margin-bottom:30px;color:#0b315a}
</style>
</head>
<body>
<div class="admin">
<a class="back" href="index.html">← Back to website</a>
<h1>Rosairo Gems — Local Admin</h1>
<div class="admin-card">
<p class="note"><strong>Important:</strong> This static admin page is a local catalogue helper. It stores browser data only. For a live multi-device inventory system, a database/backend is required. The current website itself is ready for Netlify/GitHub Pages.</p>
</div>
<div class="admin-card">
<h2>Collection images</h2>
<div id="adminList"></div>
</div>
</div>
<script>
const items=[
["Sapphire Single Stones","assets/collection-sapphire-single-stones.png"],
["Calibrated Sapphire","assets/collection-calibrated-sapphire.png"],
["Other Gems","No image assigned yet"],
["Jewellery","assets/collection-jewellery.png"]
];
const box=document.getElementById("adminList");
items.forEach(([name,img])=>{
 const row=document.createElement("div");row.className="admin-row";
 row.innerHTML=`<strong style="min-width:190px">${name}</strong>${img.startsWith("assets/")?`<img src="${img}" alt="">`:""}<input value="${img}" aria-label="${name} image path">`;
 box.appendChild(row);
});
</script>
</body>
</html>
